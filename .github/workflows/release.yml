name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: cortex-linux-x86_64

          - target: x86_64-apple-darwin
            os: macos-14
            asset_name: cortex-macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: cortex-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --bin cortex --no-default-features --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          mkdir -p dist
          BINARY=target/${{ matrix.target }}/release/cortex
          cp "${BINARY}" dist/${{ matrix.asset_name }}
          tar -czf dist/cortex-${{ github.ref_name }}-${{ matrix.asset_name }}.tar.gz \
              -C dist ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/
          retention-days: 1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum cortex-${{ github.ref_name }}-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cortex-${{ github.ref_name }}-*.tar.gz
            dist/cortex-linux-x86_64
            dist/cortex-macos-x86_64
            dist/cortex-macos-arm64
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Cortex ${{ github.ref_name }}

            ### Install (recommended)

            ```bash
            curl -sSf https://raw.githubusercontent.com/MikeSquared-Agency/cortex/main/install.sh | sh
            ```

            ### Install via Cargo

            ```bash
            cargo install cortex-memory
            ```

            ### Manual download

            | Platform | Architecture | Download |
            |----------|-------------|---------|
            | Linux    | x86_64      | `cortex-linux-x86_64` |
            | macOS    | x86_64      | `cortex-macos-x86_64` |
            | macOS    | arm64 (M1+) | `cortex-macos-arm64` |

            ### Get started

            ```bash
            cortex init && cortex serve
            ```

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish cortex-proto
        run: cargo publish -p cortex-proto --allow-dirty || echo "Already published"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish cortex-core
        run: cargo publish -p cortex-core --no-default-features --allow-dirty || echo "Already published"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish cortex-client
        run: cargo publish -p cortex-client --allow-dirty || echo "Already published"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish cortex-memory
        run: cargo publish -p cortex-memory --no-default-features --allow-dirty || echo "Already published"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install hatch twine

      - name: Build and publish
        run: cd sdks/python && hatch build && twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and publish
        run: cd sdks/typescript && npm ci && npm run build && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-bridge:
    name: Publish MCP bridge to npm
    runs-on: ubuntu-latest
    needs: github-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: mcp-bridge
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
