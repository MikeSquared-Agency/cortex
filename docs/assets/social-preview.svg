<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Graph edges (auto-discovered connections) -->
  <g stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.6">
    <!-- Cluster left -->
    <line x1="180" y1="280" x2="280" y2="200" stroke="#6366f1"/>
    <line x1="180" y1="280" x2="260" y2="370" stroke="#6366f1"/>
    <line x1="280" y1="200" x2="380" y2="260" stroke="#8b5cf6"/>
    <line x1="260" y1="370" x2="380" y2="260" stroke="#8b5cf6"/>
    <line x1="280" y1="200" x2="260" y2="370" stroke="#6366f1" opacity="0.3"/>

    <!-- Bridge edges -->
    <line x1="380" y1="260" x2="540" y2="310" stroke="#a78bfa" stroke-dasharray="6 4"/>
    <line x1="380" y1="260" x2="520" y2="200" stroke="#a78bfa" stroke-dasharray="6 4"/>

    <!-- Cluster center -->
    <line x1="540" y1="310" x2="520" y2="200" stroke="#818cf8"/>
    <line x1="540" y1="310" x2="640" y2="380" stroke="#818cf8"/>
    <line x1="520" y1="200" x2="640" y2="380" stroke="#818cf8" opacity="0.4"/>

    <!-- Bridge right -->
    <line x1="640" y1="380" x2="780" y2="320" stroke="#a78bfa" stroke-dasharray="6 4"/>
    <line x1="520" y1="200" x2="780" y2="220" stroke="#a78bfa" stroke-dasharray="6 4"/>

    <!-- Cluster right -->
    <line x1="780" y1="320" x2="780" y2="220" stroke="#6366f1"/>
    <line x1="780" y1="320" x2="880" y2="380" stroke="#6366f1"/>
    <line x1="780" y1="220" x2="900" y2="270" stroke="#8b5cf6"/>
    <line x1="880" y1="380" x2="900" y2="270" stroke="#8b5cf6"/>

    <!-- Far right -->
    <line x1="900" y1="270" x2="1020" y2="300" stroke="#6366f1"/>
    <line x1="1020" y1="300" x2="1060" y2="220" stroke="#6366f1"/>
    <line x1="900" y1="270" x2="1060" y2="220" stroke="#8b5cf6" opacity="0.4"/>
  </g>

  <!-- Graph nodes -->
  <g filter="url(#nodeGlow)">
    <!-- Left cluster -->
    <circle cx="180" cy="280" r="10" fill="#6366f1"/>
    <circle cx="280" cy="200" r="14" fill="#818cf8"/>
    <circle cx="260" cy="370" r="9" fill="#6366f1"/>
    <circle cx="380" cy="260" r="12" fill="#8b5cf6"/>

    <!-- Center cluster -->
    <circle cx="520" cy="200" r="11" fill="#818cf8"/>
    <circle cx="540" cy="310" r="16" fill="#a78bfa"/>
    <circle cx="640" cy="380" r="13" fill="#8b5cf6"/>

    <!-- Right cluster -->
    <circle cx="780" cy="220" r="10" fill="#6366f1"/>
    <circle cx="780" cy="320" r="14" fill="#818cf8"/>
    <circle cx="880" cy="380" r="9" fill="#6366f1"/>
    <circle cx="900" cy="270" r="12" fill="#8b5cf6"/>

    <!-- Far right -->
    <circle cx="1020" cy="300" r="10" fill="#818cf8"/>
    <circle cx="1060" cy="220" r="8" fill="#6366f1"/>
  </g>

  <!-- Small decorative nodes (background) -->
  <g opacity="0.25">
    <circle cx="120" cy="160" r="4" fill="#6366f1"/>
    <circle cx="1140" cy="420" r="5" fill="#818cf8"/>
    <circle cx="1100" cy="150" r="3" fill="#a78bfa"/>
    <circle cx="160" cy="460" r="4" fill="#8b5cf6"/>
    <circle cx="440" cy="440" r="3" fill="#6366f1"/>
    <circle cx="700" cy="150" r="4" fill="#818cf8"/>
  </g>

  <!-- Title: CORTEX -->
  <text x="640" y="100" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="8">CORTEX</text>

  <!-- Tagline -->
  <text x="640" y="540" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#c4b5fd" font-weight="400">Self-organizing graph memory for AI agents</text>

  <!-- Sub-tagline -->
  <text x="640" y="580" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#7c7c9a" font-weight="300">One binary · Zero dependencies · Auto-linking · Temporal validity · Trust from topology</text>
</svg>
